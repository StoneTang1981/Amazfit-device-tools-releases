name: Renew Device Tools update catalog
on:
  schedule:
    # Morning check and an independent evening recovery opportunity, UTC.
    - cron: '27 2,14 1,7,13,19,25,31 * *'
  workflow_dispatch:
    inputs:
      plugin_only:
        description: Check only the map plugin catalog
        type: boolean
        default: false
      force:
        description: Renew now even if the current timestamp is fresh
        type: boolean
        default: false

permissions: {}
concurrency:
  group: official-update-catalog
  cancel-in-progress: false

jobs:
  renew:
    if: github.repository == 'StoneTang1981/Amazfit-device-tools-releases' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: catalog-renewal
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install verified signing dependencies
        run: |
          /usr/bin/python3.12 -m venv "$RUNNER_TEMP/signer"
          "$RUNNER_TEMP/signer/bin/python" -m pip install --disable-pip-version-check --no-deps --require-hashes --only-binary=:all: --platform manylinux_2_28_x86_64 --platform manylinux2014_x86_64 --target "$RUNNER_TEMP/signer-libs" -r .github/catalog/requirements.txt
      - name: Read stable release information
        if: ${{ !inputs.plugin_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/catalog"
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > "$RUNNER_TEMP/catalog/latest.json"
      - name: Verify and renew the signed catalog
        if: ${{ !inputs.plugin_only }}
        env:
          TUF_SNAPSHOT_KEY: ${{ secrets.TUF_SNAPSHOT_KEY }}
          TUF_TIMESTAMP_KEY: ${{ secrets.TUF_TIMESTAMP_KEY }}
          FORCE: ${{ inputs.force || false }}
        run: |
          set --
          if [[ "$FORCE" == "true" ]]; then set -- --force; fi
          PYTHONPATH="$RUNNER_TEMP/signer-libs" "$RUNNER_TEMP/signer/bin/python" .github/catalog/renew.py plan "$RUNNER_TEMP/catalog" "$@"
      - name: Publish and verify the anonymous feed
        if: ${{ !inputs.plugin_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH="$RUNNER_TEMP/signer-libs" "$RUNNER_TEMP/signer/bin/python" .github/catalog/renew.py publish "$RUNNER_TEMP/catalog"
      - name: Verify and renew the signed plugin catalog
        id: plugin_plan
        if: ${{ !cancelled() }}
        env:
          TUF_SNAPSHOT_KEY: ${{ secrets.TUF_SNAPSHOT_KEY }}
          TUF_TIMESTAMP_KEY: ${{ secrets.TUF_TIMESTAMP_KEY }}
          FORCE: ${{ inputs.force || false }}
        run: |
          set --
          if [[ "$FORCE" == "true" ]]; then set -- --force; fi
          PYTHONPATH="$RUNNER_TEMP/signer-libs" "$RUNNER_TEMP/signer/bin/python" .github/catalog/renew_plugins.py plan "$RUNNER_TEMP/plugin-catalog" "$@"
      - name: Publish and verify the anonymous plugin feed
        if: ${{ !cancelled() && steps.plugin_plan.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH="$RUNNER_TEMP/signer-libs" "$RUNNER_TEMP/signer/bin/python" .github/catalog/renew_plugins.py publish "$RUNNER_TEMP/plugin-catalog"
